name: Tests on push
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    test:
        name: ubuntu (${{ matrix.node-version }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                node-version: ['22.13.0', '24']
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Audit dependencies
              run: npm audit --audit-level=high
            - name: Validate
              run: npm run check
            - name: Upload coverage
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage-node-${{ matrix.node-version }}
                  path: test-results/coverage/
                  if-no-files-found: warn
    # Keep the stable status context required by main's branch-protection rule while the test
    # matrix exposes each supported Node.js line separately.
    ubuntu:
        if: ${{ always() }}
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Require successful test matrix
              env:
                  MATRIX_RESULT: ${{ needs.test.result }}
              run: test "$MATRIX_RESULT" = success
