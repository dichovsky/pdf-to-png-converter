name: Tests on push
on:
    push:
        branches: [main]
    pull_request:
permissions:
    contents: read
jobs:
    test:
        name: ubuntu (${{ matrix.node-version }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                node-version: ['24', '26']
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '26'
                  cache: 'npm'
            - name: Install development dependencies on Node.js 26
              run: npm ci --engine-strict
            - name: Switch to the Node.js 24 runtime
              if: matrix.node-version == '24'
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
            - name: Audit dependencies
              run: npm audit --audit-level=high
            - name: Validate
              run: npm run check
            # The visual tests already fail on a missing golden PNG (they never create one when CI is set).
            # This also fails the job when the run leaves any new or modified file under test-data.
            - name: Require unchanged test fixtures
              run: |
                  git status --porcelain -- test-data
                  test -z "$(git status --porcelain -- test-data)"
            - name: Upload coverage
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage-node-${{ matrix.node-version }}
                  path: test-results/coverage/
                  if-no-files-found: error
            - name: Build the converter
              if: matrix.node-version == '24'
              run: npm run build
            - name: Install production dependencies on Node.js 24
              if: matrix.node-version == '24'
              run: npm ci --omit=dev --engine-strict --ignore-scripts
            - name: Render with the Node.js 24 production install
              if: matrix.node-version == '24'
              run: node out/cli.js test-data/sample.pdf --pages-to-process 1 --output-folder test-results/production
    windows:
        name: windows (26)
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '26'
                  cache: 'npm'
            # The visual test dependency declares only Darwin and Linux.
            - name: Install development dependencies on Windows
              run: npm ci --force
            - name: Run the Windows test suite
              run: npm run test:fast
            - name: Build the converter
              run: npm run build
            - name: Install production dependencies on Windows
              run: npm ci --omit=dev --engine-strict --ignore-scripts
            - name: Render with the native Windows production install
              run: node out/cli.js test-data/sample.pdf --pages-to-process 1 --output-folder test-results/production
    # Keep the stable status context required by main's branch-protection rule while the test
    # matrix exposes each supported Node.js line separately. The Windows smoke publishes its own
    # non-required status: Windows support is best-effort and must not block merges.
    ubuntu:
        if: ${{ always() }}
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Require successful test matrix
              env:
                  MATRIX_RESULT: ${{ needs.test.result }}
              run: test "$MATRIX_RESULT" = success
